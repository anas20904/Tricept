controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    tricept_controller:
      type: position_controllers/JointGroupPositionController

tricept_controller:
  ros__parameters:
    joints:
      - base_to_center_tube
      - piston_joint_1
      - piston_joint_2